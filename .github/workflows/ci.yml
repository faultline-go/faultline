name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - name: Check formatting
        shell: bash
        run: |
          files="$(find . -name '*.go' -not -path './vendor/*' -not -path './third_party/*' -print0 | xargs -0 gofmt -l)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - name: Test
        run: go test ./...
      - name: Validate Faultline config
        if: runner.os == 'Linux'
        run: go run ./cmd/faultline config validate --config .faultline.yaml --strict
      - name: Self-scan with coverage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go test ./... -coverprofile=coverage.out
          go run ./cmd/faultline scan ./... \
            --coverage coverage.out \
            --config .faultline.yaml \
            --format snapshot \
            --out /tmp/faultline-self-snapshot.json \
            --no-history
          jq -e '.schema_version == "faultline.snapshot.v1"' /tmp/faultline-self-snapshot.json
      - name: Go module tidy check
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: GolangCI-Lint parity gate
        if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
      - name: Vet
        run: go vet ./...
      - name: Dead code parity gate
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go install golang.org/x/tools/cmd/deadcode@latest
          bash scripts/deadcode-check.sh
      - name: Release helper parity gate
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/sign-tag-test.sh
      - name: Build without CGO
        shell: bash
        run: CGO_ENABLED=0 go build ./cmd/faultline
      - name: Build Docker image
        if: runner.os == 'Linux'
        run: docker build -t faultline:ci .

  release-dry-run:
    name: release dry run
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

  faultline:
    name: faultline scan
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - name: Run tests with coverage
        run: go test ./... -coverprofile=coverage.out
      - uses: faultline-go/action@v1
        with:
          coverage: coverage.out
          fail-on: none
          enterprise-url: https://api.gofaultline.dev
          enterprise-token: ${{ secrets.FAULTLINE_API_TOKEN || vars.FAULTLINE_API_TOKEN }}
          enterprise-org-id: ce28dedc-be2e-410a-b65d-4b51be891f47
